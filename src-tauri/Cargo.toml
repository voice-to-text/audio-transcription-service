[package]
name = "audio-transcription-service"
version = "0.1.0"
description = "Audio Transcription Studio — Local offline speech-to-text desktop app with Whisper"
authors = ["voice-to-text"]
edition = "2021"

[lib]
name = "audio_transcription_service_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
notify = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
